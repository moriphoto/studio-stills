<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JM Studio — ceramic stills</title>
  <style>
    :root { --ink:#0a0a0a; --gold:#c4a35a; --rust:#8a4a22; --mute:#8a8a8a; --live:#39ff14; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--ink); color:#f3f3f3; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; }
    header { padding:32px 32px 20px; border-bottom:1px solid rgba(255,255,255,.1); }
    header p.k { font-size:10px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--rust); }
    h1 { font-size:32px; margin-top:8px; }
    .lead { color:var(--mute); font-size:14px; max-width:58ch; margin-top:8px; line-height:1.5; }
    .bar { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:16px 32px; border-bottom:1px solid rgba(255,255,255,.1); }
    button { font:inherit; cursor:pointer; }
    .btn { background:#fff; color:#000; border:0; padding:12px 18px; font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
    .ghost { background:none; color:#fff; border:1px solid #fff; padding:12px 18px; font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
    .gold { background:none; color:var(--gold); border:1px solid var(--gold); padding:12px 18px; font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
    button.on, .gold.on, .ghost.on {
      color: var(--live);
      border-color: var(--live);
      box-shadow: 0 0 14px rgba(57,255,20,.55);
    }
    .drop { margin:24px 32px; border:1px dashed rgba(255,255,255,.2); min-height:88px; display:flex; align-items:center; justify-content:center; color:var(--mute); cursor:pointer; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; padding:0 32px 48px; }
    article { background:#111; border:1px solid rgba(255,255,255,.1); }
    article img { width:100%; aspect-ratio:16/9; object-fit:contain; background:#000; display:block; }
    article .m { padding:10px; font-size:12px; }
    #status { color:var(--gold); font-size:14px; }
    #files { color:#8a8a8a; font-size:12px; max-width:16rem; }
    label.t { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); display:flex; gap:8px; align-items:center; }
    #cal { padding:16px 32px 32px; border-bottom:1px solid rgba(255,255,255,.1); }
    #calSrc, #calPrev { width:100%; max-height:420px; object-fit:contain; background:#000; cursor:crosshair; display:block; border:1px solid rgba(255,255,255,.12); }
    #cal .row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:12px; }
  </style>
</head>
<body>
  <header>
    <p class="k">John Mackenzie Ceramics</p>
    <h1>Studio stills</h1>
    <p class="lead">Calibrate the cove. AI cuts the object. Tick Bring back if the cut ate the rim. Shadows stay soft.</p>
  </header>
  <div class="bar">
    <label class="btn" for="files">Add JPEGs</label>
    <input id="files" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png,.webp" multiple>
    <button class="gold" id="calibrate">Calibrate</button>
    <label class="t"><input type="radio" name="res" id="resWeb" checked> Web 1920</label>
    <label class="t"><input type="radio" name="res" id="resHigh"> High (upload)</label>
    <label class="t">Enhance <input id="enhance" type="range" min="100" max="130" value="108"> <span id="enhancev">1.08</span></label>
    <label class="t">Blend edge <input id="edge" type="range" min="0" max="20" value="10"> <span id="edgev">10</span></label>
    <label class="t"><input type="checkbox" id="bringBack"> Bring back</label>
    <label class="t">Shadow
      <button type="button" class="ghost" id="shL">←</button>
      <button type="button" class="ghost on" id="shC">·</button>
      <button type="button" class="ghost" id="shR">→</button>
    </label>
    <button class="ghost" id="run">Process all</button>
    <button class="ghost" id="reset">Reset</button>
    <button class="ghost" id="dl">Download singles</button>
    <span id="status"></span>
  </div>
  <div class="drop" id="drop">Drop original JPEGs. Calibrate. Point the shadow. Process all.</div>
  <section id="cal" hidden>
    <p class="k">Calibration — click dark top, then light floor</p>
    <div class="row">
      <div>
        <img id="calSrc" alt="Pick tones">
      </div>
      <div id="calPrevWrap" hidden>
        <img id="calPrev" alt="Plate">
        <button class="gold" id="calDl" style="margin-top:12px">Download studio-ground.jpg</button>
        <button class="ghost" id="calUse" style="margin-top:12px">Use this plate</button>
        <button class="ghost" id="calClose" style="margin-top:12px">Close</button>
      </div>
    </div>
  </section>
  <section id="heroWrap" hidden>
    <p class="k" style="padding:0 32px 8px">1920 × 1080</p>
    <img id="hero" alt="still" style="width:100%;display:block;border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1)">
  </section>
  <div class="grid" id="grid"></div>
  <script src="studio-1.js"></script>
  <script src="studio-cut.js"></script>
  <script src="studio-2.js"></script>
  <script src="studio-soft.js"></script>
  <script src="studio-3.js"></script>
  <script src="studio-cal.js"></script>
  <script src="admin-bridge.js"></script>
  <script type="module" src="ai-cut.js"></script>
</body>
</html>
