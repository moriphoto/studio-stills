<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <title>Cove — stills</title>
  <style>
    :root {
      --ink: #090b0d;
      --panel: #14181e;
      --panel-2: #1c2128;
      --line: rgba(255,255,255,.08);
      --ink-text: #f3f3f3;
      --mute: #8a8a8a;
      --gold: #c4a35a;
      --rust: #8a4a22;
      --live: #39ff14;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body, h1, p { margin: 0; }
    #netlify-identity-widget { z-index: 100000; }
    body {
      background: var(--ink);
      color: var(--ink-text);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    header {
      padding: 22px 18px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      max-width: 520px;
      margin: 0 auto;
    }
    h1 { font-size: 28px; font-weight: 560; letter-spacing: -.03em; }
    .lead { color: var(--mute); font-size: 13px; margin-top: 4px; }

    .simple { max-width: 520px; margin: 0 auto; padding: 18px 18px 0; display: flex; flex-direction: column; gap: 10px; }
    .primary, .secondary, .retouch, .finish-row { display: flex; gap: 8px; align-items: center; }
    .finish-row { flex-wrap: wrap; }
    .primary .add, .primary .go { flex: 1; height: 52px; border-radius: 12px; font-size: 16px; font-weight: 600; letter-spacing: 0; display: inline-flex; align-items: center; justify-content: center; }
    .primary .go { background: var(--gold); color: #14120c; border: 0; }
    .cam {
      width: 52px; height: 52px; flex: none; border-radius: 12px;
      background: var(--panel); color: #fff; border: 1px solid var(--line);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .cam svg, a.icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; }
    .secondary .ghost { height: 40px; padding: 0 14px; border-radius: 12px; }
    #moreBtn { margin-left: auto; }
    button.opt {
      color: #ff4d4d;
      border-color: #ff4d4d;
      background: transparent;
    }
    button.opt.on {
      color: #07140a;
      background: #39ff14;
      border-color: #39ff14;
      box-shadow: none;
    }
    #more {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #more[hidden] { display: none; }

    .status-row { max-width: 520px; margin: 0 auto; padding: 10px 18px 0; min-height: 22px; }

    button, .btn, label.btn { font: inherit; cursor: pointer; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn, .ghost, .gold {
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      border-radius: 10px;
    }
    .btn { background: #fff; color: #000; border: 0; }
    .ghost { background: var(--panel-2); color: #fff; border: 1px solid var(--line); }
    .gold { background: none; color: var(--gold); border: 1px solid var(--gold); }
    .btn:hover { filter: brightness(1.06); }
    .ghost:hover { border-color: rgba(255,255,255,.22); }
    .gold:hover { background: rgba(196,163,90,.08); }
    button.on, .gold.on, .ghost.on {
      color: var(--live);
      border-color: var(--live);
      box-shadow: 0 0 14px rgba(57,255,20,.45);
    }
    button:disabled { opacity: .45; cursor: wait; }
    .icon { width: 36px; height: 36px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
    .icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; }
    a.icon { text-decoration: none; color: #fff; }
    #files, #cam { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }

    label.t {
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--mute);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .seg {
      display: flex;
      background: #0e1116;
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }
    .seg label.t {
      flex: 1;
      justify-content: center;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      color: #ff4d4d;
      border: 1px solid #ff4d4d;
    }
    .seg label.t:has(input:checked) {
      color: var(--live);
      border-color: var(--live);
    }
    .seg input { accent-color: var(--gold); }
    .sliders { display: flex; flex-direction: column; gap: 10px; }
    .slider-head { display: flex; justify-content: space-between; font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: .08em; }
    .slider-head b { color: var(--gold); font-weight: 600; }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #0e1116;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .drop {
      max-width: 484px;
      margin: 8px auto 0;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6d6d6d;
      cursor: pointer;
      font-size: 12px;
    }

    #heroWrap { max-width: 520px; margin: 0 auto; padding: 14px 18px 8px; display: flex; flex-direction: column; gap: 10px; }
    .hero-box { position: relative; }
    #hero {
      width: 100%;
      max-height: none;
      height: auto;
      aspect-ratio: 16/9;
      object-fit: contain;
      display: block;
      background: #000;
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    #maskOverlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      border-radius: 14px;
    }
    #maskBar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
    }
    #maskBar[hidden] { display: none; }
    #maskBar .row { gap: 8px; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 520px; margin: 0 auto; padding: 8px 18px 48px; }
    article { background: #111; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    article img { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #000; display: block; }
    article .m { padding: 8px; font-size: 11px; display: flex; align-items: center; gap: 8px; }
    article .pick { flex: 1; display: flex; align-items: center; gap: 6px; color: #ccc; min-width: 0; overflow: hidden; }
    article .pick input { display: none; }
    button.tick {
      width: 28px; height: 28px; border-radius: 6px; padding: 0; flex: none;
      border: 2px solid #ff4d4d; background: transparent;
    }
    button.tick.on { background: #39ff14; border-color: #39ff14; }
    article .kill { margin-left: auto; background: none; border: 0; color: #8a8a8a; font-size: 16px; line-height: 1; padding: 0 4px; cursor: pointer; }
    article .kill:hover { color: #ff5a5a; }
    #status { color: var(--gold); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Cove</h1>
      <p class="lead">One object. Paper from the JPEG.</p>
    </div>
    <a class="ghost icon" id="home" href="https://moriphoto.github.io/jm-website/admin/" title="Admin" aria-label="Admin">
      <svg viewBox="0 0 24 24"><path d="M4 11 L12 4 L20 11"/><path d="M7 10 V20 H17 V10"/></svg>
    </a>
  </header>

  <div class="simple">
    <div class="primary">
      <label class="cam" for="cam" title="Phone camera" aria-label="Phone camera">
        <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><circle cx="12" cy="10" r="2.4"/><path d="M10.2 17.5 h3.6"/></svg>
      </label>
      <label class="btn add" for="files">Add</label>
      <button class="go" id="run">Process</button>
      <input id="files" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png,.webp" multiple>
      <input id="cam" type="file" accept="image/*" capture="environment">
    </div>
    <div class="secondary">
      <button class="ghost opt" id="maskTool" type="button">Mask</button>
      <button class="ghost opt" id="collection" type="button">Collection</button>
      <button class="ghost opt" id="shareLink" type="button">Link</button>
      <button class="ghost opt" id="moreBtn" type="button">More</button>
    </div>
    <div id="more" hidden>
      <div class="seg">
        <label class="t"><input type="radio" name="res" id="resWeb" checked> Web 1920</label>
        <label class="t"><input type="radio" name="res" id="resHigh"> High</label>
      </div>
      <div class="sliders">
        <div>
          <div class="slider-head">Enhance <b id="enhancev">1.08</b></div>
          <label class="t"><input id="enhance" type="range" min="100" max="130" value="108"></label>
        </div>
        <div>
          <div class="slider-head">Feather <b id="edgev">12</b></div>
          <label class="t"><input id="edge" type="range" min="0" max="28" value="12"></label>
        </div>
        <div>
          <div class="slider-head">Shadow <b id="shadowv">55</b></div>
          <label class="t"><input id="shadow" type="range" min="0" max="100" value="55"></label>
        </div>
      </div>
      <div class="finish-row">
        <button class="ghost" id="reset" type="button">Reset</button>
        <button class="ghost" id="dl" type="button">Singles</button>
        <button class="ghost" id="dlFolder" type="button">Folder</button>
        <button class="ghost opt" id="dlCeramics" type="button">To media</button>
      </div>
    </div>
  </div>

  <div class="status-row"><span id="status"></span></div>
  <div class="drop" id="drop">Drop original JPEGs. Object centred.</div>

  <section id="heroWrap" hidden>
    <div class="hero-box">
      <img id="hero" alt="still">
      <canvas id="maskOverlay"></canvas>
    </div>
    <div id="maskBar" hidden>
      <div class="row">
        <button class="ghost opt on" id="maskKeep" type="button">Keep</button>
        <button class="ghost opt" id="maskDrop" type="button">Unmask</button>
      </div>
      <div>
        <div class="slider-head">Expand <b id="expandv">0</b></div>
        <label class="t"><input id="expand" type="range" min="0" max="16" value="0"></label>
      </div>
    </div>
  </section>

  <div class="grid" id="grid"></div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="studio-1.js"></script>
  <script src="studio-cut.js"></script>
  <script src="studio-2.js"></script>
  <script src="studio-dir.js"></script>
  <script src="studio-seed.js"></script>
  <script src="studio-soft.js"></script>
  <script src="studio-mask.js"></script>
  <script src="studio-3.js"></script>
  <script src="studio-layers.js"></script>
  <script src="studio-ui.js"></script>
  <script src="studio-group.js"></script>
  <script src="admin-bridge.js"></script>
  <script src="media-push.js"></script>
  <script>
    document.getElementById("moreBtn").onclick = function () {
      var m = document.getElementById("more");
      m.hidden = !m.hidden;
      this.classList.toggle("on", !m.hidden);
    };
  </script>
  <script type="module" src="ai-cut.js"></script>
</body>
</html>
